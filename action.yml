name: "Create posts from issues or discussions"
description: "Create posts from closed issues or new discussions"
author: "Rob Mensching"

branding:
  icon: "heart"
  color: "red"

inputs:
  contentFolder:
    description: "Content folder"
    required: true
    default: "src/content/blog"
  defaultTags:
    description: "Comma-separated tags to use when the source has no labels"
    required: false
    default: "personal"
  sources:
    description: "Comma-separated post sources to process: issues, discussions, or both"
    required: false
    default: "issues"

outputs:
  path:
    description: "The output path to the created post"

runs:
  using: node20
  main: dist/index.js
