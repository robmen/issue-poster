name: Check Codebase

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install VITE+
        id: install-vite-plus
        run: npm install --global vite-plus@0.1.22

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Check Codebase
        id: check
        run: npm run check
